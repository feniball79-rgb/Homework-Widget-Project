
[project]
name = "my-project"
version = "0.1.0"
description = "Homework: 9.1; 9.2; "
project.authors = "Denis Kolyasnikov <kolyasnikovdenis@mail.ru>"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
poetry-core = "^2.4.1"
requests = "^2.34.2"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.0"
black = "^26.5.1"
isort = "^8.0.1"

[tool.poetry]
packages = [{include = "my_project", from = "src"}]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict = true
warn_unreachable = true
show_error_codes = true
warn_unused_ignores = true
allow_redefinition = true
ignore_missing_imports = true
exclude = "venv"


[tool.isort]
profile = "black"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.mypy_cache
    | \.venv
  )/
)
'''


